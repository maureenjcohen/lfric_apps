# -----------------------------------------------------------------------------
# LFRic-Venus fork only. Not an upstream Met Office workflow.
#
# Builds the `lfric_dev` stage of venus/container/Dockerfile and pushes it to
# GHCR so the unit-test workflow can start in seconds instead of rebuilding
# NetCDF, YAXT, pFUnit and XIOS each time.
#
# XIOS is required even for the unit tests: science/gungho/Makefile imports the
# lfric-xios component, which compiles against real XIOS module files.
#
# Deliberately NOT triggered by code changes: the image depends only on the
# Dockerfile.
# -----------------------------------------------------------------------------

name: Venus container image

on:
  push:
    branches: [venus, main]
    paths:
      - 'venus/container/Dockerfile'
      - '.github/workflows/venus-image.yaml'
  workflow_dispatch:

concurrency:
  group: venus-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dev-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read   # checkout
      packages: write  # push to GHCR

    steps:
      - name: Check out lfric_apps
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Buildx
        # The default docker driver cannot export a cache; type=gha needs the
        # docker-container driver this action installs.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push lfric_dev
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: venus/container
          target: lfric_dev
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lfric_dev:latest
            ghcr.io/${{ github.repository_owner }}/lfric_dev:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
